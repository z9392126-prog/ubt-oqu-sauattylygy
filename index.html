<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ҰБТ: Оқу сауаттылығы</title>
<meta name="description" content="ҰБТ-ның «Оқу сауаттылығы» пәніне дайындық: мәтін, 10 тапсырма, уақыт, нәтиже және түсіндірме.">
<meta name="theme-color" content="#14336B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314336B'/%3E%3Cpath d='M16 18h14a6 6 0 0 1 6 6v24a5 5 0 0 0-5-5H16zM48 18H38a6 6 0 0 0-6 6v24a5 5 0 0 1 5-5h11z' fill='none' stroke='%23E0AE4E' stroke-width='3.5' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=PT+Sans:wght@400;700&display=swap">
<style>
/* Layout: header band → variant shelf; test view = reading column + question card with sticky timer bar */
:root{
  color-scheme:light;
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#16203A; --muted:#5A6479; --line:#D8DEE8;
  --accent:#1D4E9E; --accent-ink:#FFFFFF; --gold:#B7801A; --gold-soft:#FBF3E2; --band:#14336B; --band-ink:#EEF2FA;
  --ok:#1F7A45; --ok-soft:#E5F4EA; --bad:#B3261E; --bad-soft:#FBE9E7; --paper:#FFFDF7;
  --f-display:"Lora",Georgia,"Times New Roman",serif;
  --f-body:"PT Sans","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F141D; --surface:#171E2B; --ink:#E7EBF2; --muted:#9DA8BA; --line:#2A3446;
  --accent:#86ADF2; --accent-ink:#0F141D; --gold:#E0AE4E; --gold-soft:#2A2416; --band:#0B1F45; --band-ink:#E7EBF2;
  --ok:#6FD39B; --ok-soft:#16301F; --bad:#F2867F; --bad-soft:#3A1A18; --paper:#1B2230; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
header.band{background:var(--band);color:var(--band-ink);padding-top:env(safe-area-inset-top,0px)}
header .wrap{padding-block:36px 32px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold);margin:0 0 6px}
header h1{font-size:clamp(34px,6vw,56px);line-height:1.05}
header .lede{margin:12px 0 0;max-width:52ch;opacity:.9}
.facts{display:flex;gap:10px;flex-wrap:wrap}
.fact{border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:10px 14px;min-width:96px}
.fact b{display:block;font-family:var(--f-display);font-size:28px;line-height:1;color:var(--gold)}
.fact span{font-size:13px;opacity:.85}
main .wrap{padding-block:28px 56px;display:grid;gap:24px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-title h2{font-size:26px}
.muted{color:var(--muted)}
.btn{border:0;border-radius:10px;padding:11px 18px;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}
.btn.gold{background:var(--gold);color:#1A1406}
.btn.danger{background:var(--bad);color:#fff}
.btn.small{padding:6px 12px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:21px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.card .btn{align-self:flex-start;margin-top:auto}
.empty{border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.tip{border-top:3px solid var(--gold);padding-top:10px}
.tip b{font-family:var(--f-display);font-size:18px;display:block}
.tip p{margin:4px 0 0;color:var(--muted);font-size:15px}
footer .wrap{padding-block:0 32px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:var(--muted);font-size:14px}
footer button{background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:4px}
label{display:grid;gap:4px;font-size:14px;color:var(--muted);min-width:0}
input[type=text],input[type=password],input[type=number],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.msg{margin:0;font-size:15px}
.msg.err{color:var(--bad)}
.msg.ok{color:var(--ok)}

/* test */
.testbar{position:sticky;top:0;z-index:5;background:var(--band);color:var(--band-ink);padding-top:env(safe-area-inset-top,0px)}
.testbar .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.testbar .t{font-family:var(--f-display);font-weight:700;font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;background:rgba(255,255,255,.12);padding:4px 12px;border-radius:8px}
.timer.low{background:var(--bad);color:#fff}
.qnav{display:flex;flex-wrap:wrap;gap:6px}
.qnav button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums}
.qnav button.done{background:var(--gold-soft);border-color:var(--gold)}
.qnav button.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qnav button.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qnav button.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.reading{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 26px;position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
.reading h3{font-size:20px;margin-bottom:10px}
.reading .txt{white-space:pre-line;font-size:17px;line-height:1.7}
.reading .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.reading .tabs button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:14px}
.reading .tabs button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:14px}
.qnum{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.qtext{font-size:19px;font-weight:700;margin:0;white-space:pre-line}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:12px 14px;cursor:pointer;font-size:16px;line-height:1.4}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;background:var(--surface)}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 2px var(--accent) inset}
.opt[aria-pressed=true] .l{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .l{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);color:#fff;border-color:var(--bad)}
.explain{background:var(--gold-soft);border-left:4px solid var(--gold);padding:10px 14px;border-radius:6px;font-size:15px;margin:0}
.confirm{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:14px;display:grid;gap:10px}

/* result */
.score{display:flex;flex-wrap:wrap;gap:24px;align-items:center}
.ring{width:150px;height:150px;flex:none}
.score h2{font-size:30px}
.review{display:grid;gap:14px}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:8px}
.rv .tag{font-size:13px;font-weight:700}
.rv .tag.ok{color:var(--ok)} .rv .tag.bad{color:var(--bad)}

/* teacher */
.tabsbar{display:flex;gap:6px;flex-wrap:wrap}
.tabsbar button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:700}
.tabsbar button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;font-size:14px}
.pill.hi{background:var(--ok-soft);color:var(--ok)} .pill.mid{background:var(--gold-soft);color:var(--gold)} .pill.lo{background:var(--bad-soft);color:var(--bad)}
.qedit{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;background:var(--bg)}
.optrow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.optrow input[type=radio]{width:20px;height:20px}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.stat b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
@media (max-width:820px){
  .split{grid-template-columns:1fr}
  .reading{position:static;max-height:none}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:16px">Сайт жұмыс істеуі үшін JavaScript қосулы болуы керек.</p></noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.97.0"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
